<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translate Language</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 0;
        font-family: "Montserrat", sans-serif;
        font-style: normal;
      }

      /* Top bar */
      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 0;
      }

      #welcome-message {
        display: none;
        overflow: hidden;
      }

      #user-name {
        margin: 0;
        font-size: 14px;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .top-bar-icons {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }

      .settings-icon {
        cursor: pointer;
        width: 20px;
        height: 20px;
      }

      .language-select {
        display: none;
        outline: none;
        border-radius: 6px;
        padding: 2px;
        background-color: #f0f0f0;
        cursor: pointer;
        font-family: inherit;
      }

      .language-select.show {
        display: block;
      }

      /* Tabs */
      .tabs {
        display: flex;
        border-bottom: 2px solid #f0f0f0;
        padding: 0 16px;
        margin-top: 10px;
      }

      .tab-btn {
        flex: 1;
        padding: 8px 4px;
        border: none;
        background: none;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        color: #aaa;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        transition: color 0.2s, border-color 0.2s;
      }

      .tab-btn.active {
        color: #4a90d9;
        border-bottom-color: #4a90d9;
        font-weight: 700;
      }

      /* Tab content */
      .tab-content {
        display: none;
        padding: 12px 16px 16px;
      }

      .tab-content.active {
        display: block;
      }

      /* Form elements */
      .input-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
        font-size: 13px;
      }

      input {
        width: 95%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        outline: none;
        font-family: inherit;
        font-size: 13px;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: #4a90d9;
      }

      #shortcutInput {
        cursor: pointer;
        background-color: #fafafa;
        font-weight: 600;
        color: #4a90d9;
      }

      #shortcutInput:focus {
        background-color: #f0f7ff;
      }

      button#saveButton {
        width: 100%;
        padding: 9px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        transition: background-color 0.2s;
      }

      button#saveButton:hover {
        background-color: #43a047;
      }

      .mode-select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        outline: none;
        background-color: #fff;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
      }

      .api-key-group {
        display: none;
      }

      .api-key-group.show {
        display: block;
      }

      .hint {
        font-size: 11px;
        color: #999;
        margin-top: 3px;
      }

      /* History tab */
      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .history-header span {
        font-size: 11px;
        color: #aaa;
      }

      .clear-btn {
        font-size: 11px;
        padding: 3px 10px;
        border: 1px solid #ffcccc;
        border-radius: 4px;
        background: #fff5f5;
        color: #e74c3c;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
      }

      .clear-btn:hover {
        background: #ffe0e0;
      }

      #history-list {
        max-height: 320px;
        overflow-y: auto;
      }

      .history-item {
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .history-item:hover {
        background: #f8f9fa;
      }

      .history-item.copied {
        background: #f0fff0;
        border-color: #c8e6c9;
      }

      .history-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      .history-provider {
        font-size: 10px;
        font-weight: 700;
        color: #4a90d9;
        background: #f0f7ff;
        padding: 1px 7px;
        border-radius: 10px;
      }

      .history-time {
        font-size: 10px;
        color: #ccc;
      }

      .history-original {
        font-size: 11px;
        color: #aaa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-bottom: 3px;
      }

      .history-translated {
        font-size: 12px;
        color: #333;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        line-height: 1.4;
      }

      .no-history {
        text-align: center;
        color: #ccc;
        font-size: 13px;
        padding: 24px 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="translator-content">
      <!-- Top bar: language picker -->
      <div class="top-bar">
        <div class="top-bar-icons">
          <select id="languageSelect" class="language-select"></select>
          <img src="setting.png" class="settings-icon" id="settingsIcon" alt="Settings" />
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="settings">⚙️ Settings</button>
        <button class="tab-btn" data-tab="history">📋 History</button>
      </div>

      <!-- Settings Tab -->
      <div id="tab-settings" class="tab-content active">
        <div class="input-group">
          <label for="translationMode">Translation Mode:</label>
          <select id="translationMode" class="mode-select">
            <option value="free">Google Translate (Free)</option>
            <option value="openai">OpenAI (GPT)</option>
            <option value="openrouter">OpenRouter</option>
            <option value="groq">Groq</option>
            <option value="megallm">MegaLLM</option>
            <option value="ollama">Ollama (Local)</option>
          </select>
        </div>

        <div id="api-key-group" class="input-group api-key-group">
          <label for="apiKey" id="apiKeyLabel">API Key:</label>
          <input type="text" id="apiKey" placeholder="Your API Key" />
          <div class="hint" id="apiKeyHint"></div>
        </div>

        <div id="model-group" class="input-group api-key-group">
          <label for="modelInput">Model: (Optional)</label>
          <input type="text" id="modelInput" placeholder="Leave blank for default" />
          <div class="hint" id="modelHint"></div>
        </div>

        <div class="input-group">
          <label for="shortcutInput">Keyboard Shortcut:</label>
          <input
            type="text"
            id="shortcutInput"
            readonly
            placeholder="Click & press keys..."
          />
          <div class="hint">Click the field, then press your key combo</div>
        </div>

        <button id="saveButton">Save</button>
      </div>

      <!-- History Tab -->
      <div id="tab-history" class="tab-content">
        <div class="history-header">
          <span>Recent translations (max 30)</span>
          <button id="clearHistory" class="clear-btn">Clear All</button>
        </div>
        <div id="history-list"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
